clear_value:
  name: Clear Time Value
  description: >
    Clear a time or schedule start/end entity back to the device's own
    "unset" state (equivalent to clearing that same slot from the heat
    pump's own on-device menu). Home Assistant's built-in time.set_value
    service cannot do this -- it requires a real time value and has no way
    to express "no time set" -- so this service writes the device's 0x80
    "unset" sentinel directly instead.
  target:
    entity:
      domain: time
      integration: thz

refresh_block:
  name: Refresh Block
  description: >
    Force an immediate re-read of a specific data block from the heat pump
    and push the updated values to all associated entities.
    Useful after writing a value when you want HA to reflect the device state
    without waiting for the next poll interval.
  fields:
    block:
      name: Block
      description: >
        Block to refresh. Accepts any form: "FB", "pxxFB", "0xFB".
        Examples: "FB" (temperatures & status), "F3" (DHW), "F4" (heating circuit),
        "F2" (heat request), "0A0176" (operating status & ventilation).
      required: true
      example: "FB"
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Config entry ID. Only required when multiple THZ devices are configured.
      required: false
      selector:
        text:

set_diverter_valve:
  name: Set Diverter Valve
  description: >
    Move the 3-way diverter valve motor toward a position.
    The motor does NOT auto-stop — you must send position "off" once the valve
    has reached the target position.
    Both "heating" and "dhw" are guarded by the diverterValve bit in pxxF2:
    movement is only allowed in the direction the heat pump is already pressurising.
    After 3 seconds the motor is automatically stopped on both directions.
    "off" is always allowed and stops the motor immediately without waiting.
  fields:
    position:
      name: Position
      description: >
        Target position for the valve motor.
        "heating" — run motor toward heating circuit. Refused if DHW is active.
        "dhw"     — run motor toward DHW (warm water). Refused if heating is active.
        "off"     — stop motor on both directions. Always allowed.
      required: true
      example: "dhw"
      selector:
        select:
          options:
            - "heating"
            - "dhw"
            - "off"
    entry_id:
      name: Entry ID
      description: Config entry ID. Only required when multiple THZ devices are configured.
      required: false
      selector:
        text:

read_raw_register:
  name: Read Raw Register
  description: >
    Read a raw register/block from the heatpump and return the hex dump.
    Useful for debugging and verifying register contents.
  fields:
    command:
      name: Command
      description: >
        Hex command string to send to the heatpump.
        Examples: "FB" (sGlobal), "F2" (sControl), "0A0176" (sDisplay),
        "FC" (sTimedate), "FD" (sFirmware), "FE" (sFirmware-Id)
      required: true
      example: "FB"
      selector:
        text:

scan_raw_registers:
  name: Scan Raw Registers
  description: >
    Scan multiple raw registers and return all successful responses.
    You can use either a wildcard pattern with X (for example: "0A0XXX")
    or an explicit start/end hex range.
  fields:
    pattern:
      name: Pattern
      description: >
        6-character hex pattern with optional X wildcards.
        Example: "0A0XXX" scans from 0A0000 to 0A0FFF.
      required: false
      example: "0A0XXX"
      selector:
        text:
    start:
      name: Start
      description: Start of inclusive 6-character hex range.
      required: false
      example: "0A0000"
      selector:
        text:
    end:
      name: End
      description: End of inclusive 6-character hex range.
      required: false
      example: "0A0FFF"
      selector:
        text:
    entry_id:
      name: Entry ID
      description: >
        Optional config entry id. Required when multiple THZ devices are configured.
      required: false
      selector:
        text:
    include_errors:
      name: Include errors
      description: Include failed commands in response results.
      required: false
      default: false
      selector:
        boolean:
    decode_values:
      name: Decode values
      description: Try to decode payload values and include decoded candidates in results.
      required: false
      default: false
      selector:
        boolean:
    max_results:
      name: Max results
      description: Maximum number of commands to scan.
      required: false
      default: 65535
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    preview_limit:
      name: Preview limit
      description: >
        Maximum number of results shown in the persistent notification.
        Set to 0 to show all results. The full result list is always returned
        in the service response regardless of this setting.
      required: false
      default: 20
      selector:
        number:
          min: 0
          max: 65535
          mode: box

watch_raw_registers_changes:
  name: Watch Raw Registers Changes
  description: >
    Find valid raw registers in a pattern/range and watch only those registers
    for value changes during the specified duration.
    Failed registers are excluded after initial validation and are not rescanned.
  fields:
    pattern:
      name: Pattern
      description: >
        6-character hex pattern with optional X wildcards.
        Example: "0A0XXX" watches from 0A0000 to 0A0FFF.
      required: false
      example: "0A0XXX"
      selector:
        text:
    start:
      name: Start
      description: Start of inclusive 6-character hex range.
      required: false
      example: "0A0000"
      selector:
        text:
    end:
      name: End
      description: End of inclusive 6-character hex range.
      required: false
      example: "0A0FFF"
      selector:
        text:
    duration_seconds:
      name: Duration seconds
      description: Total watch duration in seconds.
      required: true
      example: 30
      selector:
        number:
          min: 1
          mode: box
    interval_seconds:
      name: Interval seconds
      description: >
        Optional delay between iterations.
        If omitted or 0, polling is continuous (as fast as possible).
      required: false
      default: 0
      example: 0.5
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
    entry_id:
      name: Entry ID
      description: >
        Optional config entry id. Required when multiple THZ devices are configured.
      required: false
      selector:
        text:
    max_results:
      name: Max results
      description: Maximum number of commands to include from pattern/range.
      required: false
      default: 65535
      selector:
        number:
          min: 1
          max: 65535
          mode: box

backup_parameters:
  name: Backup Parameters
  description: >
    Save the current value of every writable LWZ/THZ parameter (heating
    curves, schedules, DHW settings, and other number/switch/select/time
    registers) to a timestamped JSON file under config/thz_backups/.
    That folder lives inside the Home Assistant config directory, so it is
    automatically included in — and brought back by — Home Assistant's own
    Backup feature, with no separate export step. Use restore_parameters
    afterwards to actually push a saved snapshot's values back onto the
    heat pump (for example after a full factory reset).
  fields:
    label:
      name: Label
      description: >
        Optional short label appended to the backup's filename, e.g.
        "before_reset". Letters, numbers, "-" and "_" only.
      required: false
      example: "before_reset"
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Config entry ID. Only required when multiple THZ devices are configured.
      required: false
      selector:
        text:

restore_parameters:
  name: Restore Parameters
  description: >
    Push the values from a saved parameter backup back onto the heat pump.
    Each parameter is written using the integration's current register map,
    so a restore keeps working even if the integration has been updated
    since the backup was taken — parameters no longer present are skipped
    and reported rather than failing the whole restore. Set dry_run to
    preview what would be written without touching the device.
  fields:
    filename:
      name: Backup file
      description: >
        Filename of the backup to restore, as returned by
        list_parameter_backups (e.g. "thz_backup_20260825-120000.json").
        If omitted, the most recent backup is used.
      required: false
      example: "thz_backup_20260825-120000.json"
      selector:
        text:
    dry_run:
      name: Dry run
      description: >
        If enabled, nothing is written to the device — the response reports
        what would have been restored instead.
      required: false
      selector:
        boolean:
    only:
      name: Only these parameters
      description: >
        Optional list of parameter names to restore, restricting the
        operation to a subset of the backup (e.g. just the heating curve
        parameters). Leave empty to restore everything in the backup.
      required: false
      selector:
        text:
          multiple: true
    entry_id:
      name: Entry ID
      description: Config entry ID. Only required when multiple THZ devices are configured.
      required: false
      selector:
        text:

list_parameter_backups:
  name: List Parameter Backups
  description: >
    List the parameter backup files saved under config/thz_backups/, newest
    first, with each one's creation time and parameter count — use this to
    find the filename to pass to restore_parameters.
