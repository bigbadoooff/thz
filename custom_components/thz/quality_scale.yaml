rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: >
      tests_ha/ runs every path of the config and reconfigure flow that Home
      Assistant can reach (IP, USB with port detection, errors, duplicates,
      reconfigure); tests/ adds the defensive branches (missing entry,
      OS errors while resolving ports). Together they cover the whole file.
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >
      Services raise ServiceValidationError or HomeAssistantError; entity
      actions that cannot write raise HomeAssistantError through
      write_errors.raise_write_errors.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >
      The device logs the heat pump not answering and answering again
      once; block coordinators and the parameter poller stay quiet
      meanwhile. A single register failing while the device answers is
      logged by the poller as a warning once, and its coming back at info.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The device has no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Serial and ser2net connections cannot be discovered.
  discovery:
    status: exempt
    comment: Serial and ser2net connections cannot be discovered.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: A config entry is exactly one heat pump.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >
      A drifted device clock raises a fixable repair issue. The remaining
      persistent notifications show the results of service calls
      (raw register reads, parameter restore), which are no repairs.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: No HTTP communication.
  strict-typing: done
