[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
# The register/readings/write maps are hand-aligned tables; the formatter
# would break them up line by line.
exclude = [
    "custom_components/thz/register_maps/readings_map_*.py",
    "custom_components/thz/register_maps/register_map_[0-9a]*.py",
    "custom_components/thz/register_maps/write_map_*.py",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "D",     # pydocstyle
    "F",     # pyflakes
    "BLE",   # blind exception (except Exception)
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "C90",   # mccabe complexity
]
ignore = [
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D212",  # Multi-line docstring summary should start at the first line (we use D213 style)
    "D400",  # First line should end with a period
    "D401",  # First line should be in imperative mood
    "D415",  # First line should end with punctuation
]

[tool.ruff.lint.per-file-ignores]
"custom_components/thz/register_maps/*.py" = ["D100", "D104", "E501"]
# Test method/class names are self-documenting; docstrings add no value there.
# Mutable class attributes on test doubles and nested patch() blocks are fine
# in tests.
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D107", "RUF012", "SIM117"]
"tests_ha/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["custom_components.thz", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
files = ["custom_components/thz"]
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
check_untyped_defs = true

# Dev-only type stubs (see requirements_test.txt: mypy, homeassistant-stubs,
# types-pyserial) may lag behind the minimum Home Assistant version this
# integration targets. custom_components/thz/_typing_compat.py and scattered
# `# type: ignore` comments document and confine the resulting gaps; see
# that module's docstring for details.
#
# python_version here must stay >= whatever CPython version mypy itself is
# invoked under (see .github/workflows/ci.yml's typecheck job) -- it's a
# checking-semantics target, not a request to mypy's own parser, which can
# only read syntax its host interpreter's grammar supports (e.g.
# homeassistant-stubs' PEP 695/696 `type` statements need mypy running on
# Python 3.12+ regardless of this setting).

# Strict typing for the protocol core. `strict = true` is not allowed per
# module, so the flags it enables are listed individually. mypy sees the
# package as `thz` (custom_components/ has no __init__.py). Add modules here
# once they pass.
[[tool.mypy.overrides]]
module = [
    "thz.parameter_io",
    "thz.value_codec",
    "thz.register_maps.register_map_manager",
    "thz.register_maps.model",
    "thz.protocol",
    "thz.transport",
    "thz.exceptions",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
extra_checks = true
