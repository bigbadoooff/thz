[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "D",     # pydocstyle
    "F",     # pyflakes
    "BLE",   # blind exception (except Exception)
]
ignore = [
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D212",  # Multi-line docstring summary should start at the first line (we use D213 style)
    "D400",  # First line should end with a period
    "D401",  # First line should be in imperative mood
    "D415",  # First line should end with punctuation
]

[tool.ruff.lint.per-file-ignores]
"custom_components/thz/register_maps/*.py" = ["D100", "D104", "E501"]
# Test method/class names are self-documenting; docstrings add no value there.
"tests/*.py" = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
files = ["custom_components/thz"]
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
check_untyped_defs = true

# Dev-only type stubs (see requirements_test.txt: mypy, homeassistant-stubs,
# types-pyserial) may lag behind the minimum Home Assistant version this
# integration targets. custom_components/thz/_typing_compat.py and scattered
# `# type: ignore` comments document and confine the resulting gaps; see
# that module's docstring for details.
