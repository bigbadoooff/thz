name: Release

# Runs after CI succeeds on main (not on PRs, forks, or the nightly cron --
# see the `if` below), so a version bump only ships a release once the
# commit that bumped it has actually passed tests/lint/hassfest. Bumping
# the version is the trigger; CI passing is the gate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/thz/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check_tag
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG section
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os
          import re

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # Matches "## [X.Y.Z] - ..." (any dash/date suffix) up to the next
          # "## [" heading or end of file.
          pattern = rf"##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=\n##\s*\[|\Z)"
          match = re.search(pattern, text, re.DOTALL)
          notes = match.group(1).strip() if match else ""
          # Strip the "---" separator markdown places before the next heading.
          notes = re.sub(r"\n?-{3,}\s*$", "", notes).strip()
          if not notes:
              notes = f"Release {version}. See CHANGELOG.md for details."
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          PYEOF

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --notes-file release_notes.md \
            $PRERELEASE_FLAG
