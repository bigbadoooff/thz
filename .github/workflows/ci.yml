name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Validate with hassfest
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master

  hacs:
    name: HACS validation
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: "integration"

  lint:
    name: Lint (ruff)
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install lint dependencies
        run: pip install -r requirements_test.txt
      - name: Run ruff
        run: ruff check custom_components/thz tests tests_ha
      - name: Check formatting
        run: ruff format --check custom_components/thz tests tests_ha

  typecheck:
    name: Type check (mypy)
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # mypy itself must run under an interpreter new enough to parse
          # whatever syntax homeassistant-stubs' .pyi files use (e.g. PEP
          # 695/696 type statements) -- this is independent of the
          # [tool.mypy] python_version target in pyproject.toml, which only
          # controls checking semantics, not what mypy's own parser can
          # physically read. See pyproject.toml's comment on this setting.
          python-version: "3.13"
      - name: Install type-check dependencies
        run: |
          pip install -r requirements_test.txt
          pip install --no-deps homeassistant-stubs
      - name: Run mypy
        run: mypy

  test:
    name: Test suite
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run test suite with coverage
        run: >
          python3 -m pytest tests/ -v
          --cov=custom_components/thz --cov-report=term-missing
          --cov-fail-under=95

  test-home-assistant:
    name: Test suite (real Home Assistant)
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # pytest-homeassistant-custom-component follows Home Assistant's
          # own minimum Python version.
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements_test_ha.txt
      - name: Run tests against Home Assistant
        run: python3 -m pytest tests_ha -v -o asyncio_mode=auto
