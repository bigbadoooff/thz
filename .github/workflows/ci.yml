name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Validate with hassfest
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  lint:
    name: Lint (ruff)
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Set up Python
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - name: Install lint dependencies
        run: pip install -r requirements_test.txt
      - name: Run ruff
        run: ruff check custom_components/thz tests

  typecheck:
    name: Type check (mypy)
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Set up Python
        uses: "actions/setup-python@v5"
        with:
          # mypy itself must run under an interpreter new enough to parse
          # whatever syntax homeassistant-stubs' .pyi files use (e.g. PEP
          # 695/696 type statements) -- this is independent of the
          # [tool.mypy] python_version target in pyproject.toml, which only
          # controls checking semantics, not what mypy's own parser can
          # physically read. See pyproject.toml's comment on this setting.
          python-version: "3.13"
      - name: Install type-check dependencies
        run: |
          pip install -r requirements_test.txt
          pip install --no-deps homeassistant-stubs
      - name: Run mypy
        run: mypy

  test:
    name: Test suite
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: Set up Python
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run test suite with coverage
        run: >
          python3 -m pytest tests/ -v
          --cov=custom_components/thz --cov-report=term-missing
          --cov-fail-under=85
